<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPY Bot Dashboard</title>
<style>
@font-face{font-family:"Inter";font-weight:400;src:url(/static/fonts/Inter-Regular.ttf) format("truetype");font-display:swap}
@font-face{font-family:"Inter";font-weight:500;src:url(/static/fonts/Inter-Medium.ttf) format("truetype");font-display:swap}
@font-face{font-family:"Inter";font-weight:600;src:url(/static/fonts/Inter-SemiBold.ttf) format("truetype");font-display:swap}
@font-face{font-family:"JetBrains Mono";font-weight:400;src:url(/static/fonts/JetBrainsMono-Regular.ttf) format("truetype");font-display:swap}
@font-face{font-family:"JetBrains Mono";font-weight:500;src:url(/static/fonts/JetBrainsMono-Medium.ttf) format("truetype");font-display:swap}
:root{
 --navy:#0B1F33;--teal:#14B8A6;--amber:#F59E0B;--paper:#F8FAFC;--surface:#FFFFFF;
 --border:rgba(11,31,51,.12);--text:var(--navy);--text-2:rgba(11,31,51,.70);--text-3:rgba(11,31,51,.50);
 --teal-soft:rgba(20,184,166,.12);--teal-line:rgba(20,184,166,.40);--amber-soft:rgba(245,158,11,.14);--amber-line:rgba(245,158,11,.50);
 --navy-soft:rgba(11,31,51,.06);--navy-mid:rgba(11,31,51,.30);
 --err:#B42318; /* only for small failure labels: an order placed, a failed run, failing tests */
 --font-sans:"Inter",system-ui,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,monospace;--radius:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--text);font:400 14px/1.5 var(--font-sans)}
.topbar{height:6px;background:var(--navy);display:flex}.topbar i{flex:1}.topbar b{width:64px;background:var(--teal)}.topbar em{width:16px;background:var(--amber)}
header{max-width:1240px;margin:0 auto;padding:24px 16px 0;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{font-size:22px;font-weight:600;margin:0}
.sub{color:var(--text-2)}.s3{color:var(--text-3)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
nav{max-width:1240px;margin:16px auto 0;padding:0 16px;display:flex;gap:24px;border-bottom:1px solid var(--border);overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--text-2);font:500 14px var(--font-sans);padding:10px 0;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}
nav button.on{color:var(--navy);border-bottom-color:var(--teal)}
nav .n{font:500 11px var(--font-mono);min-width:18px;padding:0 6px;border-radius:999px;background:var(--amber-soft);border:1px solid var(--amber-line);color:var(--navy)}
.tab{display:none}.tab.on{display:block}
.grid{max-width:1240px;margin:0 auto;display:grid;gap:16px;padding:24px 16px;grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:1/-1}
@media(max-width:1000px){.span3,.span4{grid-column:1/-1}}@media(max-width:600px){.span2{grid-column:auto}}
.p{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;min-width:0;display:flex;flex-direction:column;gap:8px}
.p h3{margin:0;font-size:13px;font-weight:500;color:var(--text-2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.p h3 .t{display:flex;align-items:center;gap:6px}
.section{grid-column:1/-1;font-size:16px;font-weight:500;margin:8px 0 -8px}
.big{font:500 30px/1.15 var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mid{font:500 20px var(--font-mono);font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--border)}
.row>span:last-child:not(:first-child){text-align:right}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.foot{margin-top:auto;padding-top:4px;font-size:12px;color:var(--text-3)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font:500 12px var(--font-mono);border:1px solid var(--border);background:var(--surface);color:var(--text-2);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--navy-mid)}
.chip.ok{background:var(--teal-soft);border-color:var(--teal-line);color:var(--navy)}.chip.ok i{background:var(--teal)}
.chip.human{background:var(--amber-soft);border-color:var(--amber-line);color:var(--navy)}.chip.human i{background:var(--amber)}
.chip.err{color:var(--err);border-color:rgba(180,35,24,.35)}.chip.err i{background:var(--err)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:var(--navy-mid);vertical-align:1px}
.dot.ok{background:var(--teal)}.dot.err{background:var(--err)}.dot.human{background:var(--amber)}
.errtxt{color:var(--err);font-weight:500}
.q{display:inline-grid;place-items:center;width:16px;height:16px;border:1px solid var(--border);border-radius:50%;font:500 10px var(--font-sans);color:var(--text-3);cursor:help}
.stages{display:flex;gap:8px;flex-wrap:wrap}
.st{flex:1;min-width:140px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;color:var(--text-2);font-size:13px;display:flex;flex-direction:column;gap:4px}
.st b{font-weight:500;color:var(--navy)}
.st.now{border-color:var(--teal-line);background:var(--teal-soft)}.st.blocked{border-color:var(--amber-line);background:var(--amber-soft)}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);margin-bottom:8px;color:var(--navy)}
.alert.red{border-left:3px solid var(--err)}.alert.amber{border-left:3px solid var(--amber)}
svg text{font:11px var(--font-mono);fill:var(--text-3)}
.key{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-2)}.key i{display:inline-block;width:12px;height:3px;margin-right:6px;vertical-align:3px;border-radius:2px}
.cal{display:grid;grid-template-columns:56px repeat(5,1fr);gap:4px;align-items:center}
.cal .h{font:11px var(--font-mono);color:var(--text-3);text-align:center}.cal .d{font:12px var(--font-mono);color:var(--text-2)}
.cell{height:28px;border-radius:6px;background:var(--navy-soft);display:grid;place-items:center;font:500 12px var(--font-mono);color:var(--text-3);cursor:default}
.cell.ok{background:var(--teal-soft);box-shadow:inset 0 0 0 1px var(--teal-line);color:var(--navy)}
.cell.bad,.cell.missed,.cell.error{background:var(--surface);box-shadow:inset 0 0 0 1px rgba(180,35,24,.45);color:var(--err)}
.cell.planned{background:var(--surface);box-shadow:inset 0 0 0 1px var(--border)}
.cell.next{background:var(--surface);box-shadow:inset 0 0 0 1px var(--navy-mid);color:var(--navy);border:1px dashed var(--navy-mid)}
.meter{height:8px;background:var(--navy-soft);border-radius:4px;overflow:hidden}.meter i{display:block;height:100%;background:var(--teal)}
.inbox .item{padding:10px 0;border-top:1px solid var(--border)}.inbox .why{color:var(--text-2);font-size:13px;margin:2px 0 0 16px}
table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;border-top:1px solid var(--border);text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
td:first-child,th:first-child{text-align:left;font-family:var(--font-sans)}th{color:var(--text-3);font:500 12px var(--font-sans)}
select{background:var(--surface);color:var(--navy);border:1px solid var(--border);border-radius:8px;font:inherit;padding:6px 10px}
.ctl{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}@media(max-width:600px){.stat{grid-template-columns:1fr 1fr}}
.stat div{background:var(--navy-soft);border-radius:8px;padding:12px;font-size:12px;color:var(--text-2)}.stat b{display:block;font:500 22px var(--font-mono);color:var(--navy);margin-top:2px}
.log{font:12px/1.7 var(--font-mono);color:var(--text-2);white-space:pre-wrap;margin:0}
.notice{grid-column:1/-1;display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);padding:12px 16px;color:var(--text-2)}
.notice b{color:var(--navy);font-weight:500}
.cal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.cal-nav{display:flex;align-items:center;gap:8px}.cal-nav b{font-size:16px;font-weight:600;min-width:150px;text-align:center}
.cal-nav button{border:1px solid var(--border);background:var(--surface);color:var(--navy);border-radius:8px;width:32px;height:32px;font:500 16px var(--font-sans);cursor:pointer}
.cal-nav button:disabled{opacity:.35;cursor:default}
.cal-sum{display:flex;gap:24px;flex-wrap:wrap;font-size:12px;color:var(--text-2)}.cal-sum span b{display:block;font:500 16px var(--font-mono);color:var(--navy);font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,.8fr);gap:8px}
.cal .hd{font-size:12px;color:var(--text-3);padding:0 4px}
.cell{border:1px solid var(--border);border-radius:8px;padding:8px;min-height:88px;display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--text-2);background:var(--surface);min-width:0}
.cell .dn{font:500 12px var(--font-mono);color:var(--text-3)}.cell .v{font:500 15px var(--font-mono);color:var(--navy);font-variant-numeric:tabular-nums}
.cell .t{overflow:hidden;text-overflow:ellipsis}
.cell.gain{background:var(--teal-soft);border-color:var(--teal-line)}
.cell.loss{background:var(--navy-soft);border-color:var(--navy-mid)}
.cell.closed{background:var(--paper);border-style:dashed}.cell.blank{visibility:hidden}.cell.future{background:transparent}
.cell.today{box-shadow:inset 0 0 0 2px var(--navy)}
.cell.wk{background:transparent;border-style:dashed;justify-content:center}
@media(max-width:600px){.cal{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.cal .wkc{display:none}.cell{min-height:56px;padding:6px 4px}.cell .t{display:none}.cell .v{font-size:12px}}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}@media(max-width:600px){.days{grid-template-columns:repeat(2,1fr)}}
.day{border:1px solid var(--border);border-radius:8px;padding:10px;font-size:12px;display:flex;flex-direction:column;gap:2px;color:var(--text-2)}
.day.done{background:var(--teal-soft);border-color:var(--teal-line)}.day .v{font:500 15px var(--font-mono);color:var(--navy)}
.gauge{position:relative;height:56px;margin:4px 0}
.gauge .track{position:absolute;left:0;right:0;top:22px;height:8px;border-radius:4px;background:var(--navy-soft)}
.gauge .need{position:absolute;top:14px;width:2px;height:24px;background:var(--navy)}
.gauge .real{position:absolute;top:18px;width:16px;height:16px;border-radius:50%;background:var(--teal);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--teal);transform:translateX(-8px)}
.gauge .lab{position:absolute;font:11px var(--font-mono);color:var(--text-3);transform:translateX(-50%);white-space:nowrap}
.xgrid{display:grid;gap:16px;grid-template-columns:repeat(4,minmax(0,1fr))}@media(max-width:1000px){.xgrid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.xgrid{grid-template-columns:1fr}}
.xgrid .p{background:var(--paper)}
</style></head><body>
<div class="topbar"><i></i><b></b><em></em></div>
<header><div><h1>SPY credit-spread bot</h1><div class="sub" id="clock">loading…</div></div><span class="chip ok"><i></i>read-only · no orders</span></header>
<nav id="nav"></nav>
<section class="tab" id="t-overview"><div class="grid" id="overview"></div></section>
<section class="tab" id="t-profit"><div class="grid" id="profit"></div></section>
<section class="tab" id="t-paper"><div class="grid" id="paper"></div></section>
<section class="tab" id="t-evidence"><div class="grid" id="evidence"></div></section>
<section class="tab" id="t-safety"><div class="grid" id="safety"></div></section>
<section class="tab" id="t-explorer"><div class="grid" id="explorer"></div></section>
<script>
// Live page: every number comes from /api/status, built from the project's files. Read-only.
const money=v=>v==null?'–':(v<0?'−':'')+'$'+Math.abs(v).toFixed(2);
const sgn=v=>v==null?'–':(v>=0?'+':'−')+'$'+Math.abs(v).toFixed(2);
const dot=s=>`<span class="dot ${s}"></span>`;
const okdot=ok=>dot(ok?'ok':'err');
const tip=t=>`<span class="q" title="${t.replace(/"/g,'&quot;')}">?</span>`;
const h3=(title,t,right='')=>`<h3><span class="t">${title}${t?' '+tip(t):''}</span>${right}</h3>`;
const pct=v=>v==null?'–':(v*100).toFixed(1)+'%';
const k1=v=>Math.round(v/1000).toLocaleString()+'k';
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BANDS=[['<15','under 15'],['15-20','15-20'],['20-30','20-30'],['30+','30+']];
let S,E;
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function recall(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}}
function show(id){if(!document.getElementById('t-'+id))id='overview';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==id));document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.id=='t-'+id));store('tab',id)}

/* ---------- charts ---------- */
function chart(){const W=640,H=240,P={l:52,r:14,t:14,b:44},max=0.45;
 const x=k=>P.l+(k-0.6)/1.4*(W-P.l-P.r),y=v=>P.t+(1-Math.min(v,max)/max)*(H-P.t-P.b);
 const line=key=>S.breakeven.filter(b=>b[key]!=null).map((b,i)=>(i?'L':'M')+x(b.k).toFixed(1)+','+y(b[key]).toFixed(1)).join('');
 let g='';[0,.1,.2,.3,.4].forEach(v=>g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(11,31,51,.12)"/><text x="${P.l-8}" y="${y(v)+4}" text-anchor="end">$${v.toFixed(2)}</text>`);
 S.breakeven.forEach(b=>g+=`<text x="${x(b.k)}" y="${H-P.b+18}" text-anchor="middle">${b.k.toFixed(1)}</text>`);
 g+=`<text x="${(P.l+W-P.r)/2}" y="${H-6}" text-anchor="middle">distance from SPY, in expected moves (k)</text>`;
 const pts=S.realCredits.slice(-10).map(r=>`<circle cx="${x(r.k)}" cy="${y(r.mid)}" r="5" fill="#0B1F33"><title>${r.day}: ${money(r.mid)}</title></circle>`).join('');
 const last=S.realCredits[S.realCredits.length-1];
 const lab=last?`<text x="${x(last.k)+10}" y="${y(last.mid)-8}" style="fill:#0B1F33">real credits, ${S.realCredits.length} day${S.realCredits.length==1?'':'s'}</text>`:'';
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Credit needed to break even by distance">${g}<path d="${line('base')}" fill="none" stroke="rgba(11,31,51,.45)" stroke-width="2" stroke-dasharray="5 4"/><path d="${line('v2')}" fill="none" stroke="#14B8A6" stroke-width="2.5"/>${pts}${lab}</svg>`;}

function evChart(){const ev=S.evidence,W=600,H=200,P={l:52,r:12,t:12,b:30},max=0.3;
 const x=i=>P.l+(i+.5)*(W-P.l-P.r)/4,y=v=>P.t+(1-(Math.max(-max,Math.min(max,v))+max)/(2*max))*(H-P.t-P.b);
 let g='';[-.3,-.15,0,.15,.3].forEach(v=>g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="${v==0?'rgba(11,31,51,.45)':'rgba(11,31,51,.12)'}"/><text x="${P.l-8}" y="${y(v)+4}" text-anchor="end">${v>0?'+':''}${v.toFixed(2)}</text>`);
 BANDS.forEach(([,l],i)=>g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">VIX ${l}</text>`);
 const pts=ev.points.map((p,j)=>{const i=BANDS.findIndex(b=>b[0]==p.band),c=p.margin>=0?'#14B8A6':'#0B1F33',off=(j%5-2)*6;
  return `<circle cx="${x(i)+off}" cy="${y(p.margin)}" r="5" fill="${c}"><title>${p.day}: ${sgn(p.margin)}</title></circle>`}).join('');
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Real credit minus needed credit per day">${g}<text x="${W-P.r}" y="${y(.3)-2}" text-anchor="end">above 0 = paid</text>${pts}</svg>`;}

function profitChart(days){const W=560,H=230,P={l:52,r:12,t:24,b:44};
 const done=days.map(d=>d.result);let run=0;const cum=days.map(d=>run+=d.result||0);
 const hi=Math.max(15,...done.filter(v=>v!=null),...cum),lo=Math.min(0,...done.filter(v=>v!=null),...cum);
 const span=hi-lo,step=span>150?50:span>60?20:span>30?10:5;
 const y=v=>P.t+(hi-v)/(hi-lo)*(H-P.t-P.b),n=days.length,bw=Math.min(44,(W-P.l-P.r)/n*0.6),cx=i=>P.l+(i+.5)*(W-P.l-P.r)/n;
 let g='';for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step)g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="${v==0?'rgba(11,31,51,.45)':'rgba(11,31,51,.12)'}"/><text x="${P.l-8}" y="${y(v)+4}" text-anchor="end">${v<0?'−':''}$${Math.abs(v)}</text>`;
 const why={'no exit':'no exit','no entry':'no entry','no runs':'no runs','sat out':'sat out'};
 days.forEach((d,i)=>{
  if(d.state=='done'){const top=y(Math.max(d.result,0)),h=Math.max(2,Math.abs(y(d.result)-y(0)));
   g+=`<rect x="${cx(i)-bw/2}" y="${top}" width="${bw}" height="${h}" rx="4" fill="${d.result>=0?'#14B8A6':'#0B1F33'}"><title>${d.day}: ${sgn(d.result)}</title></rect>`;
   if(n<=10)g+=`<text x="${cx(i)}" y="${d.result>=0?top-6:top+h+14}" text-anchor="middle" style="fill:#0B1F33">${(d.result>=0?'+':'−')+Math.abs(d.result).toFixed(2)}</text>`;}
  else g+=`<rect x="${cx(i)-bw/2}" y="${y(0)-2}" width="${bw}" height="4" rx="2" fill="rgba(11,31,51,.18)"><title>${d.day}: ${d.state}</title></rect>`;
  g+=`<text x="${cx(i)}" y="${H-P.b+18}" text-anchor="middle">${d.day}</text>`;
  if(d.state!='done')g+=`<text x="${cx(i)}" y="${H-P.b+32}" text-anchor="middle">${why[d.state]||''}</text>`;});
 const pts=cum.map((v,i)=>cx(i).toFixed(1)+','+y(v).toFixed(1)).join(' ');
 const lx=cx(n-1),ly=y(cum[n-1]);
 g+=`<polyline points="${pts}" fill="none" stroke="#0B1F33" stroke-width="2"/><circle cx="${lx}" cy="${ly}" r="4" fill="#0B1F33"/><text x="${lx-8}" y="${ly-10}" text-anchor="end" style="fill:#0B1F33">total ${sgn(cum[n-1])}</text>`;
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Would-be profit per day with a running total line">${g}</svg>`;}

function calendar(){const slots=S.logger.schedule,stateTip={ok:'Passed the check',bad:'Ran but failed the check',error:'Stopped with an error before the check',missed:'Was scheduled but no file appeared',off:'Not scheduled',next:'Next scheduled run',planned:'Scheduled'};
 return `<div class="cal"><span></span>${slots.map(s=>`<span class="h">${s}</span>`).join('')}${Object.entries(S.calendar).map(([d,row])=>`<span class="d">${d}</span>${slots.map(s=>{const st=row[s];return `<div class="cell ${st}" title="${d} ${s}: ${stateTip[st]}">${{ok:'✓',bad:'✕',error:'✕',missed:'!',next:'next',planned:'',off:''}[st]}</div>`}).join('')}`).join('')}</div>
 <div class="key"><span><i style="background:#14B8A6"></i>passed</span><span><i style="background:#B42318"></i>failed / missed</span><span><i style="background:rgba(11,31,51,.3)"></i>next</span><span><i style="background:rgba(11,31,51,.08)"></i>not scheduled</span></div>`;}

function shadow(){const sh=S.shadow;
 if(!sh)return `<div class="p span2">${h3("Latest would-be trade")}<div class="sub">No 10:15 run logged yet.</div></div>`;
 const res=sh.resultCautious==null?'<span class="s3">waiting for the 3:30 run</span>':`<b class="num">${sgn(sh.resultCautious)}</b> <span class="s3">cautious · ${sgn(sh.resultBest)} best</span>`;
 return `<div class="p span2">${h3(`Latest would-be trade · ${sh.day}`,'What the rules would have done, priced with real logged quotes. Nothing is sent to Robinhood.','<span class="chip">no order</span>')}
 <div class="row"><span>Rules used</span><span>${esc(sh.rules)}</span></div>
 ${sh.skipChecks.map(c=>`<div class="row"><span>${c.hit==null?dot(''):c.hit?dot('human'):dot('ok')}${c.rule}</span><span class="s3">${c.hit?'skip'+(c.note?': '+esc(c.note):''):esc(c.note)||'clear'}</span></div>`).join('')}

 const ds=m.days.map(x=>({...x,...(by[x.date]||{})})),done=ds.filter(d=>d.state=='done'),res=done.map(d=>d.result);

 const cell=d=>{
  const n=+d.date.slice(8),dn=`<span class="dn">${n}${d.early?' · early close':''}</span>`,tc=d.date==todayISO?' today':'';
  if(!d.open)return `<div class="cell closed${tc}">${dn}<span class="t">market closed</span></div>`;

  if(d.state=='done')return `<div class="cell ${d.result>=0?'gain':'loss'}${tc}" title="${esc(d.spread)}: credit ${d.credit.toFixed(2)} at 10:15, worth ${d.value.toFixed(2)} at 3:30. Best-case costs ${sgn(d.best)}.">${dn}<span class="v">${sgn(d.result)}</span><span class="t">${esc(d.spread)}</span><span class="t">${d.credit.toFixed(2)} → ${d.value.toFixed(2)}</span></div>`;
  const t={'sat out':'sat out: '+(d.skipped||[]).map(r=>why[r]||r).join(', '),'no exit':`credit ${d.credit!=null?d.credit.toFixed(2):'–'}, no 3:30 price`,'no entry':'no 10:15 run','no runs':'not logged'}[d.state];
  return `<div class="cell${tc}" title="${esc(t)}">${dn}<span class="v">${d.state=='sat out'?'$0.00':'–'}</span><span class="t">${esc(t)}</span></div>`};

 const flush=()=>{const r=wk.filter(d=>d.state=='done').map(d=>d.result);g+=row.join('')+`<div class="cell wk wkc">${r.length?`<span class="v">${sgn(r.reduce((a,b)=>a+b,0))}</span><span class="t">${r.length} trade${r.length==1?'':'s'}</span>`:'<span class="t s3">–</span>'}</div>`;row=[];wk=[]};
 ds.forEach(d=>{row.push(cell(d));wk.push(d);if(row.length==5)flush()});

 return `<div class="cal-head"><div class="cal-nav"><button data-cal="${i-1}" ${i?'':'disabled'} aria-label="previous month">‹</button><b>${esc(m.label)}</b><button data-cal="${i+1}" ${i<M.length-1?'':'disabled'} aria-label="next month">›</button></div>

  <div class="cal">${g}</div>`}

 /* SAFETY & COST */
 const au=S.audit,co=S.costs,fr=S.freshness;
 const costBars=co.runs.length?co.runs.slice(-8).map(r=>`<div><div class="row" style="border:0;padding:0 0 4px"><span class="num">${r.label}</span><span class="num s3">${k1(r.output)} out · ${k1(r.write)} new · ${k1(r.reread)} re-read</span></div><div class="meter"><i style="width:${Math.min(100,r.output/40000*100)}%;background:${r.output>20000?'#0B1F33':'#14B8A6'}"></i></div></div>`).join(''):'<div class="sub">No logger runs found in the run records yet.</div>';
 document.getElementById('safety').innerHTML=`
 <div class="p span2">${h3('Order-tool audit','Searches every Claude run record in this project for any order-tool call. Orders placed must always be 0.')}
  <div class="stat"><div>orders placed<b class="${au.orderCalls?'errtxt':''}">${au.orderCalls}</b></div><div>order previews<b>${au.previewCalls}</b></div><div>tool calls scanned<b>${au.toolCalls.toLocaleString()}</b></div></div>
  <div class="row"><span>${okdot(true)}Run records scanned</span><span class="num">${au.transcripts}</span></div>
  <div class="row"><span>${okdot(au.guardTest=='pass')}Guard tests (no order code, tools blocked)</span><span class="num">${au.guardTest}</span></div>
  <div class="row"><span>${okdot(au.denyRulesCoverPreview)}Settings block the preview tools</span><span>${au.denyRulesCoverPreview?'yes':'<span class="errtxt">no</span>'}</span></div>
  ${au.previewCalls?`<div class="foot">First preview: ${au.previewWhen}. A preview asks Robinhood to check an order; it never places one${au.denyRulesCoverPreview?', and previews are now blocked':''}.</div>`:''}</div>
 <div class="p span2">${h3('Safety')}${S.safety.map(x=>`<div class="row"><span>${x.label.includes('approve')?dot(''):okdot(x.ok)}${x.label}<div class="s3" style="font-size:12px;margin-left:16px">${esc(x.detail)}</div></span><span class="num ${!x.ok&&!x.label.includes('approve')?'errtxt':''}">${esc(x.value)}</span></div>`).join('')}</div>
 <div class="p span2">${h3('Tokens per logger run','Tokens are what each Claude run uses. Output = text Claude writes; re-read = earlier conversation read again each step. Budget target is about '+k1(co.budgetPerDay)+' per trading day.')}${costBars}
  <div class="foot">Bar turns navy above 20k output tokens.</div></div>
 <div class="p">${h3('Data freshness','The price test needs SPY and VIX history up to the last trading day. When it falls behind, plan v2 rules cannot be checked for the latest days.')}<div class="big">${fr.behindDays?fr.behindDays+' day'+(fr.behindDays>1?'s':''):'current'}</div><div class="sub">${fr.behindDays?'behind · ':''}last ${fr.last}</div>${fr.missing.length?`<div class="row"><span>Missing</span><span class="num">${fr.missing.length>3?fr.missing.length+' days':fr.missing.join(', ')}</span></div>`:''}</div>
 <div class="p">${h3('Logger runs')}${S.logger.runs.slice(-8).map(r=>`<div class="row" title="${esc(r.problems.join('; '))}"><span class="num">${okdot(r.result=='ok')}${r.day.slice(5)} ${r.time}</span><span class="num ${r.contracts==null?'errtxt':''}">${r.contracts??'failed'}</span></div>`).join('')||'<div class="sub">none yet</div>'}<div class="foot">contracts per run</div></div>`;

 /* EXPLORER */
 const keep=['xv','xw','xk'].map(id=>document.getElementById(id)?.value);
 document.getElementById('explorer').innerHTML=`
 <div class="p span4">${h3('Setup explorer','Pick a setup to see how it did in the price test and what real quotes looked like. Put side shown for real quotes.')}
  <div class="ctl"><label>Rules <select id="xv"><option value="v2">plan v2</option><option value="put_skips">put only + skips</option><option value="baseline">sell put every day</option></select></label>
  <label>Width <select id="xw"><option>2</option><option selected>5</option><option>10</option></select></label>
  <label>Distance k <select id="xk">${[...Array(16)].map((_,i)=>{const k=(0.5+i*.1).toFixed(1);return `<option ${k=='1.0'?'selected':''}>${k}</option>`}).join('')}</select></label></div>
  <div id="xout"></div></div>`;
 ['xv','xw','xk'].forEach((id,i)=>{const el=document.getElementById(id);if(keep[i])el.value=keep[i];el.onchange=explore});
 explore();
 show(recall('tab','overview'));
 tick();
}

function explore(){const v=xv.value,w=xw.value,k=(+xk.value).toFixed(1),r=E.rows[`${v}|${w}|${k}`]||{},q=E.real[`${w}|${k}`];
 const col=(p,lab)=>{const d=r[p];if(!d)return `<div class="p">${h3(lab)}<div class="sub">no data</div></div>`;return `<div class="p">${h3(lab)}
 <div class="row"><span>Needed, cautious</span><b class="num">${money(d.be)}</b></div><div class="row"><span>Needed, best case</span><span class="num">${money(d.best)}</span></div>
 <div class="row"><span>Days traded / skipped</span><span class="num">${d.n} / ${d.skip}</span></div><div class="row"><span>Loss days</span><span class="num">${pct(d.loss)}</span></div>
 <div class="row"><span>Full-loss days</span><span class="num">${pct(d.full)}</span></div><div class="row"><span>Worst losing streak</span><span class="num">${d.streak}</span></div></div>`};
 let real='<div class="sub">No 10:15 run logged yet.</div>';
 if(q){const paid=q.mid!=null&&r.validation&&q.mid>=r.validation.be;
  real=`<div class="row"><span>Expected move to 3:30</span><span class="num">$${E.move}</span></div><div class="row"><span>Put spread</span><span class="num">${q.short} / ${q.long}</span></div>
  ${q.mid==null?`<div class="row"><span>Real credit</span><span>not logged (strike not listed)</span></div>`:`
  <div class="row"><span>Real midpoint credit</span><b class="num">${money(q.mid)}</b></div><div class="row"><span>Short leg delta</span><span class="num">${q.delta??'–'}</span></div>
  <div class="row"><span>vs 2024 cautious need (all days)</span><span>${dot(paid?'ok':'')}${paid?'above':'below'} by <span class="num">${money(Math.abs(q.mid-(r.validation?r.validation.be:0)))}</span></span></div>`}`;}
 xout.innerHTML=`<div class="xgrid">${col('train','2022-23 (training)')}${col('validation','2024 (validation)')}
 <div class="p span2">${h3('Real quote'+(E.day?` · ${E.day} 10:15 · SPY ${E.spy} · VIX ${E.vix}`:''))}${real}
 <div class="foot">Plan v2 may pick a call spread on down-trend days; call quotes are logged too.</div></div></div>`;}

function tick(){const el=document.getElementById('cd');if(!el||!S.nextRunISO)return;const ms=new Date(S.nextRunISO)-new Date();if(ms<=0){el.textContent='due';return}const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4);el.textContent=`${h}h ${String(m).padStart(2,'0')}m`;}

async function load(){
 try{const res=await fetch('/api/status',{cache:'no-store'});const data=await res.json();
  if(data.error){document.getElementById('clock').textContent='Problem reading project files: '+data.error;return}
  S=data;E=S.explorer;render();
 }catch(e){document.getElementById('clock').textContent='Dashboard server not reachable. Start it with: .venv/bin/python -m spybot dashboard';}
}
load();setInterval(load,60000);setInterval(tick,30000);
</script></body></html>
